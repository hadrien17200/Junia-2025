


name: PHP Lint + Docker Build Push + deploy

on:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/mon-site:latest" .

      - name: List Docker images
        run: docker images

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/mon-site:latest" .
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/mon-site:latest"

  deploy:
    runs-on: self-hosted
    needs: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy locally
        run: |
          docker pull "${{ secrets.DOCKERHUB_USERNAME }}/mon-site:latest"
          docker stop nginx-junia php-fpm-junia mysql-junia || true
          docker rm nginx-junia php-fpm-junia mysql-junia || true
          docker run -d --name mysql-junia \
            -e MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -e MYSQL_DATABASE=site \
            -e MYSQL_USER=app \
            -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            mysql:8.0
          docker run -d --name php-fpm-junia --link mysql-junia "${{ secrets.DOCKERHUB_USERNAME }}/mon-site:latest"
          docker run -d --name nginx-junia -p 80:80 --link php-fpm-junia \
            -v /home/hadrien/Junia-2025/nginx-config:/etc/nginx/conf.d nginx:latest
